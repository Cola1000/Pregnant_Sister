name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: v1.0.${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Package repository
        run: |
          mkdir -p dist
          git archive --format=zip --prefix=pregnant_sister/ -o "dist/pregnant_sister-${VERSION}.zip" HEAD
          git archive --format=tar.gz --prefix=pregnant_sister/ -o "dist/pregnant_sister-${VERSION}.tar.gz" HEAD

      - name: Publish release
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.zip dist/*.tar.gz --clobber
          else
            gh release create "$VERSION" dist/*.zip dist/*.tar.gz \
              --target "$GITHUB_SHA" \
              --title "Pregnant_Sister $VERSION" \
              --notes "Seluruh isi repositori Pregnant_Sister (kode pustaka src/, test, laporan, dan dokumentasi API) dari commit ${GITHUB_SHA::7}. Ekstrak arsip, jalankan pip install -r requirements.txt, lalu impor dengan from src.encrypt import encrypt. Dokumentasi: https://cola1000.github.io/Pregnant_Sister/"
          fi
