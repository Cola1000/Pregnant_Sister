name: Release library

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/release.yml"
      - "README.md"
      - "image.jpg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: v1.0.${{ github.run_number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Package src, requirements.txt, and README
        run: |
          mkdir -p dist/pregnant_sister
          cp -r src requirements.txt README.md image.jpg dist/pregnant_sister/
          find dist -type d -name __pycache__ -prune -exec rm -rf {} +
          cd dist
          zip -qr "pregnant_sister-${VERSION}.zip" pregnant_sister
          tar -czf "pregnant_sister-${VERSION}.tar.gz" pregnant_sister

      - name: Publish release
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" dist/*.zip dist/*.tar.gz --clobber
          else
            gh release create "$VERSION" dist/*.zip dist/*.tar.gz \
              --target "$GITHUB_SHA" \
              --title "Pregnant_Sister $VERSION" \
              --notes "Pustaka Pregnant_Sister (folder src/ dan requirements.txt) dari commit ${GITHUB_SHA::7}. Ekstrak arsip, jalankan pip install -r requirements.txt, lalu impor dengan from src.encrypt import encrypt. Dokumentasi: https://cola1000.github.io/Pregnant_Sister/"
          fi
